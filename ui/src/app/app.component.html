<header>
  <div id="logo">
    <img src="/assets/ggs.png" />
  </div>
  
  <nav>
    <a [routerLink]="['shop']">Shop</a>
    &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;
    <a [routerLink]="['about']">About</a><br/>
    <app-fade-out-text [text]="'Product inventory reset'"></app-fade-out-text>
  </nav>

  <div id="search">
    <div id="searchIcon"></div>
    <div>
      <mat-form-field>
        <input id="txtSearch" matInput type="text" enterkeyhint="search" placeholder="Search product" aria-label="Search products"
               [formControl]="txtSearch" [matAutocomplete]="auto" #trigger="matAutocompleteTrigger"
               (keydown.enter)="searchAll(trigger)">
        <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayTitle" (optionSelected)="selectSuggestion($event)">
          <mat-option *ngFor="let option of filteredOptions | async" [value]="option" style="font-size:9pt;background-color: white;">
            {{option.title}}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>
    </div>
  </div>
  <a [routerLink]="['/cart']"><div id="cart"></div></a>
  <div id="numCartItems">{{cartSvc.numItems}}</div>
</header>

<router-outlet></router-outlet>

<footer>
  &copy; 2025 GigaGarageSale. All rights reserved.
</footer>

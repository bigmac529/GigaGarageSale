<span class="stars" role="img" [attr.aria-label]="'Rated ' + rating + ' out of 5'">
  @for (star of stars; track star) {
    <app-icon name="star" [size]="20" [filled]="true" [stroke]="0" class="star" [class.on]="star <= rating" />
  }
  <span class="value" aria-hidden="true">{{ rating }}.0</span>
</span>
